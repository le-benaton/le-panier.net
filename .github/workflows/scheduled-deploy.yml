name: Scheduled deploy to Cloudflare

on:
  schedule:
    - cron: "0 15 * * 0" # JST 月 00:00
    - cron: "0 21 * * 0" # JST 月 06:00
    - cron: "0 3 * * 1" # JST 月 12:00
    - cron: "0 9 * * 1" # JST 月 18:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci && npm run build
        env:
          MENU_API_URL: ${{ secrets.MENU_API_URL }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "57bafd0e2348b266e72e821f03157b41"
          command: deploy
