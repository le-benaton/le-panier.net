name: Scheduled deploy to Firebase Hosting

on:
  schedule:
    - cron: '0 15 * * 0'   # JST 月 00:00
    - cron: '0 21 * * 0'   # JST 月 06:00
    - cron: '0 3 * * 1'    # JST 月 12:00
    - cron: '0 9 * * 1'    # JST 月 18:00
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
        env:
          MENU_API_URL: ${{ secrets.MENU_API_URL }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BENATON_JAPAN }}
          channelId: live
          projectId: benaton-japan
          target: benaton-panier
